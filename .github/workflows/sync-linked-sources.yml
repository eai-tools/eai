name: Sync Linked Sources

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Commit to main and tag a release when drift is found"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-linked-sources
  cancel-in-progress: false

jobs:
  sync:
    name: Refresh bundled upstream sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync linked sources
        run: npm run sync:linked-sources

      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- .; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          VERSION=$(node -p "require('./package.json').version")
          echo "current_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump patch version
        if: steps.drift.outputs.changed == 'true'
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "next_version=$VERSION" >> "$GITHUB_ENV"

      - name: Validate refreshed bundle
        if: steps.drift.outputs.changed == 'true'
        run: |
          npm run build
          npm run lint
          npm run typecheck
          npm run test

      - name: Create sync pull request
        if: steps.drift.outputs.changed == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: codex/linked-sources-sync
          delete-branch: true
          commit-message: "chore: sync linked sources"
          title: "chore: sync linked sources"
          body: |
            Refreshes the bundled upstream source manifest and Gofer payload.

            Updated by `${{ github.workflow }}` after detecting drift in:
            - `gofer`
            - `eai-app-template`
            - template-resolved `@enterpriseaigroup/*` packages

            Proposed version bump: `${{ env.next_version }}`
          labels: |
            chore
            automation

      - name: Commit and tag release
        if: steps.drift.outputs.changed == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'))
        run: |
          VERSION="${{ env.next_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .gofer-version package.json package-lock.json resources/linked-sources.json resources/gofer/
          git commit -m "chore: sync linked sources for v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:main --follow-tags
